name: Build SideStore IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: 1.7.0
  push:
    branches: [main]
    paths:
      - "Hermes_IOS/**"
      - "Hermes_IOS.xcodeproj/**"
      - "Config/**"
      - "Package.swift"
      - ".github/workflows/build-sidestore-ipa.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          xcodebuild \
            -project Hermes_IOS.xcodeproj \
            -scheme Hermes_IOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM='' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Package IPA for SideStore
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Hermes_IOS.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/HermexNotify.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Hermex-Notify-1.7.0.ipa" Payload

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hermex-Notify-IPA
          path: Hermex-Notify-1.7.0.ipa
          if-no-files-found: error

      - name: Publish or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version || '1.7.0' }}
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Hermex-Notify-1.7.0.ipa --clobber
          else
            gh release create "$TAG" Hermex-Notify-1.7.0.ipa \
              --title "Hermex Notify ${RELEASE_VERSION}" \
              --notes "IPA non signée prévue pour SideStore. Ajoute des rappels iOS persistants aux tâches Hermes créées dans l'application."
          fi
